<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabi | Espaço de Acolhimento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topo">
      <div class="avatar" id="avatarGabi" onclick="darOiGabi()" title="Clique na Gabi! 💚">
        <img src="gabi.png.jpeg" alt="Gabi">
        <div class="balao-gabi" id="balaoGabi">
          Oi! Estou aqui com você. 💚
        </div>
      </div>
      <div>
        <h1>Gabi</h1>
        <p>Seu espaço de acolhimento</p>
      </div>
      <span class="status">● Online</span>
    </header>

    <section id="mensagens" class="mensagens" aria-live="polite">
      <div class="mensagem gabi">
        <strong>Gabi</strong>
        <p>Oi! Que bom ter você aqui. 💚 Pode conversar comigo sobre o que quiser. Como você está se sentindo hoje?</p>
      </div>
    </section>

    <form id="formulario" class="entrada">
      <input
        id="entrada"
        type="text"
        placeholder="Escreva sua mensagem..."
        autocomplete="off"
        required
      >
      <button id="enviar" type="submit">Enviar</button>
    </form>

    <footer>
      A Gabi é uma ferramenta de acolhimento e não substitui ajuda profissional.
    </footer>
  </main>

  <script src="script.js"></script>
  <script>
    const frasesGabi = [
      "Oi! Estou aqui com você. 💚",
      "Respire fundo... um passo de cada vez. 🌿",
      "Pode desabafar comigo, estou ouvindo! ✨",
      "Seja gentil com você hoje. 💚"
    ];
    let indiceFrase = 0;

    function darOiGabi() {
      const avatar = document.getElementById("avatarGabi");
      const balao = document.getElementById("balaoGabi");

      // Faz a bonequinha dar uma balançadinha animada ao clicar
      avatar.classList.remove("pulando");
      void avatar.offsetWidth;
      avatar.classList.add("pulando");

      // Troca e mostra a frase fofa
      indiceFrase = (indiceFrase + 1) % frasesGabi.length;
      balao.textContent = frasesGabi[indiceFrase];
      balao.classList.add("visivel");

      setTimeout(() => {
        balao.classList.remove("visivel");
      }, 3500);
    }

    // Dá um oi automático ao abrir o site
    window.addEventListener("load", () => {
      setTimeout(darOiGabi, 700);
    });
  </script>
</body>
</html>
