<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabi | Espaço de Acolhimento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topo">
      <div class="avatar">
        <img src="gabi.png.jpeg" alt="Gabi">
      </div>
      <div>
        <h1>Gabi</h1>
        <p>Seu espaço de acolhimento</p>
      </div>
      <span class="status">● Online</span>
    </header>

    <section id="mensagens" class="mensagens" aria-live="polite">
      <div class="mensagem gabi">
        <strong>Gabi</strong>
        <p>Oi! Que bom ter você aqui. 💚 Pode conversar comigo. Como você está hoje?</p>
      </div>
    </section>

    <form id="formulario" class="entrada">
      <input
        id="entrada"
        type="text"
        placeholder="Escreva sua mensagem..."
        autocomplete="off"
        required
      >
      <button id="enviar" type="submit">Enviar</button>
    </form>

    <footer>
      A Gabi é uma ferramenta de acolhimento e não substitui ajuda profissional.
    </footer>
  </main>

  <script>
    const formulario = document.getElementById("formulario");
    const entrada = document.getElementById("entrada");
    const enviar = document.getElementById("enviar");
    const mensagens = document.getElementById("mensagens");
    const historico = [];

    function adicionarMensagem(autor, texto, classe) {
      const div = document.createElement("div");
      div.className = "mensagem " + classe;

      const titulo = document.createElement("strong");
      titulo.textContent = autor;

      const paragrafo = document.createElement("p");
      paragrafo.textContent = texto;

      div.appendChild(titulo);
      div.appendChild(paragrafo);
      mensagens.appendChild(div);
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    formulario.addEventListener("submit", async function(evento) {
      evento.preventDefault();

      const texto = entrada.value.trim();
      if (!texto) return;

      adicionarMensagem("Você", texto, "usuario");
      historico.push({ role: "user", content: texto });

      entrada.value = "";
      entrada.disabled = true;
      enviar.disabled = true;
      enviar.textContent = "...";

      try {
        const resposta = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: historico })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(dados.error || "Erro no servidor");
        }

        const textoGabi = dados.reply || "Desculpe, não consegui responder agora.";
        adicionarMensagem("Gabi", textoGabi, "gabi");
        historico.push({ role: "assistant", content: textoGabi });

      } catch (erro) {
        adicionarMensagem(
          "Gabi",
          "Erro técnico: " + erro.message,
          "gabi"
        );
      } finally {
        entrada.disabled = false;
        enviar.disabled = false;
        enviar.textContent = "Enviar";
        entrada.focus();
      }
    });
  </script>
</body>
</html>
