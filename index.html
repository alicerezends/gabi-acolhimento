<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabi | Espaço de Acolhimento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topo">
      <div class="avatar">
        <img src="gabi.png.jpeg" alt="Gabi">
      </div>
      <div>
        <h1>Gabi</h1>
        <p>Seu espaço de acolhimento</p>
      </div>
      <span class="status">● Online</span>
    </header>

    <section id="mensagens" class="mensagens" aria-live="polite">
      <div class="mensagem gabi">
        <strong>Gabi</strong>
        <p>Oi! Que bom ter você aqui. 💚 Pode conversar comigo. Como você está hoje?</p>
      </div>
    </section>

    <form id="formulario" class="entrada">
      <input
        id="entrada"
        type="text"
        placeholder="Escreva sua mensagem..."
        autocomplete="off"
        required
      >
      <button id="enviar" type="submit">Enviar</button>
    </form>

    <footer>
      A Gabi é uma ferramenta de acolhimento e não substitui ajuda profissional.
    </footer>
  </main>

  <div class="mascote-flutuante" onclick="trocarFrase()">
    <div class="balao-gabi" id="balaoGabi">
      Oi! Estou aqui se você quiser desabafar ou conversar. 💚✨
    </div>
    <img src="gabi.png.jpeg" alt="Gabi">
  </div>

  <script src="script.js"></script>
  <script>
    const frases = [
      "Oi! Estou aqui se você quiser desabafar ou conversar. 💚✨",
      "Respire fundo... um passo de cada vez. 🌿",
      "Pode contar comigo para organizar seus pensamentos. 💚"
    ];
    let idx = 0;
    function trocarFrase() {
      idx = (idx + 1) % frases.length;
      document.getElementById("balaoGabi").textContent = frases[idx];
    }
  </script>
</body>
</html>
