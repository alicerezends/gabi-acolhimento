<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabi | Seu Espaço de Acolhimento</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="luz-fundo luz-1"></div>
  <div class="luz-fundo luz-2"></div>

  <div class="layout-principal">
    <!-- LADO ESQUERDO: PERSONAGEM EM DESTAQUE -->
    <aside class="palco-personagem" id="palco-gabi">
      <div class="aura-personagem"></div>
      <div class="personagem-moldura">
        <img src="gabi.png.png" alt="Gabi, sua assistente de acolhimento">
      </div>
      <div class="status-personagem">
        <span class="ponto-online"></span>
        <span id="texto-status">Gabi está ouvindo você</span>
      </div>
    </aside>

    <!-- LADO DIREITO: ÁREA DO CHAT -->
    <main class="app">
      <header class="topo">
        <div class="avatar-mobile">
          <img src="gabi.png.png" alt="Gabi">
        </div>

        <div class="info-gabi">
          <h1>Gabi</h1>
          <p>Seu espaço seguro de acolhimento</p>
        </div>

        <div class="selo-seguro">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>Espaço Seguro</span>
        </div>
      </header>

      <section id="mensagens" class="mensagens" aria-live="polite">
        <div class="data-hoje">Hoje</div>
        
        <div class="mensagem gabi">
          <p>Oi! Que bom ter você aqui. 💚<br><br>Antes de começarmos, como você gostaria que eu te chamasse? Qual é o seu nome?</p>
        </div>
      </section>

      <div class="rodape-chat">
        <div id="sugestoes" class="sugestoes">
          <button type="button" class="chip" data-texto="Estou me sentindo ansioso(a) hoje">Estou ansioso(a)</button>
          <button type="button" class="chip" data-texto="Preciso desabafar sobre o meu dia">Preciso desabafar</button>
          <button type="button" class="chip" data-texto="Só queria conversar um pouco">Só conversar</button>
        </div>

        <form id="formulario" class="entrada">
          <input
            id="entrada"
            type="text"
            placeholder="Escreva o que você está sentindo..."
            autocomplete="off"
            required
          >
          <button id="enviar" type="submit" aria-label="Enviar mensagem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>

        <footer>
          A Gabi é uma assistente virtual de acolhimento e não substitui acompanhamento médico ou psicológico.
        </footer>
      </div>
    </main>
  </div>

  <script>
    const formulario = document.getElementById("formulario");
    const entrada = document.getElementById("entrada");
    const enviar = document.getElementById("enviar");
    const mensagens = document.getElementById("mensagens");
    const sugestoes = document.getElementById("sugestoes");
    const palcoGabi = document.getElementById("palco-gabi");
    const textoStatus = document.getElementById("texto-status");
    const historico = [];

    function adicionarMensagem(texto, classe) {
      const div = document.createElement("div");
      div.className = "mensagem " + classe;

      const paragrafo = document.createElement("p");
      paragrafo.textContent = texto;

      div.appendChild(paragrafo);
      mensagens.appendChild(div);
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    function mostrarDigitando() {
      palcoGabi.classList.add("pensando");
      textoStatus.textContent = "Gabi está escrevendo...";

      const div = document.createElement("div");
      div.id = "digitando";
      div.className = "mensagem gabi digitando-box";
      div.innerHTML = '<div class="bolinhas"><span></span><span></span><span></span></div>';
      mensagens.appendChild(div);
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    function removerDigitando() {
      palcoGabi.classList.remove("pensando");
      textoStatus.textContent = "Gabi está ouvindo você";

      const el = document.getElementById("digitando");
      if (el) el.remove();
    }

    document.querySelectorAll(".chip").forEach(botao => {
      botao.addEventListener("click", () => {
        entrada.value = botao.getAttribute("data-texto");
        sugestoes.style.display = "none";
        formulario.dispatchEvent(new Event("submit"));
      });
    });

    formulario.addEventListener("submit", async function(evento) {
      evento.preventDefault();

      const texto = entrada.value.trim();
      if (!texto) return;

      sugestoes.style.display = "none";
      adicionarMensagem(texto, "usuario");
      historico.push({ role: "user", content: texto });

      entrada.value = "";
      entrada.disabled = true;
      enviar.disabled = true;
      mostrarDigitando();

      try {
        const resposta = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: historico })
        });

        const dados = await resposta.json();
        removerDigitando();

        if (!resposta.ok) {
          throw new Error(dados.error || "Erro no servidor");
        }

        const textoGabi = dados.reply || "Desculpe, não consegui responder agora.";
        adicionarMensagem(textoGabi, "gabi");
        historico.push({ role: "assistant", content: textoGabi });

      } catch (erro) {
        removerDigitando();
        adicionarMensagem(
          "Tive um probleminha técnico para responder agora. Tente novamente em instantes. 💚",
          "gabi"
        );
      } finally {
        entrada.disabled = false;
        enviar.disabled = false;
        entrada.focus();
      }
    });
  </script>
</body>
</html>
